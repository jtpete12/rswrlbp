name: ci

# This repository's own CI. Plugin repos do not call this file — they use the
# composite action at the repo root (`uses: jtpete12/rswrlbp@<tag>`); see the
# comment in action.yml for why it is not a reusable workflow.
#
# Three jobs. `self-test` proves the checker still works; `action` runs the
# published action over this repo exactly as a plugin repo would; `links`
# checks the documentation's citations still resolve. A checker nobody tested
# is worse than no checker, because people trust its silence.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a renamed wiki section is caught without anyone noticing it by
    # hand. Links rot on the far end's schedule, not on ours.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.mjs
      # Structural validation of the endpoint reference. The test run above
      # only cross-checks the spec against the checker; it does not know what
      # a valid OpenAPI document is. Swagger UI rendered the spec happily while
      # it still had twelve validation errors, so "it looks fine in the browser"
      # is not the same check. This needs a real validator, which is why it runs
      # here rather than in the dependency-free test suite.
      - name: Validate the OpenAPI spec
        run: npm run docs:lint

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dogfood the action through `./`, the same code path `jtpete12/rswrlbp@tag`
      # takes. Only `plugins`: `tests/fixtures/offender` is a deliberately
      # abusive plugin and linting it is supposed to fail.
      - uses: ./
        with:
          path: plugins
          gate: error
      # And prove the gate gates: the offender must fail it.
      - name: Offender fails the gate
        run: |
          if node plugins/osrs-plugin-review/scripts/osrs-lint.mjs tests/fixtures/offender --quiet; then
            echo "::error::the offender fixture passed the error gate"
            exit 1
          fi

  links:
    runs-on: ubuntu-latest
    # Deliberately not on pull requests. This fetches the wiki and mediawiki.org
    # to verify anchors, and running it on every push of every branch would be
    # exactly the needless repeat traffic the practices argue against. Pushes to
    # main, a weekly cron, and on demand is proportionate.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check documentation links and anchors
        run: npm run docs:links
